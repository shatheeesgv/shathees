<html>
  <head>
    <style>
      body {
        margin: 0; /* Remove default margins */
        padding: 0; /* Remove default padding */
        height: 100vh; /* Full viewport height */
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #e0eafc, #cfdef3); /* Soft gradient background */
        font-family: 'Arial', sans-serif; /* Clean font */
        color: white; /* Default text color */
      }

      .container {
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5); /* Enhanced shadow for depth */
        padding: 40px; /* Padding inside the container */
        background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
        border-radius: 20px; /* Rounded corners */
        max-width: 400px; /* Max width for container */
        text-align: center; /* Center text */
        position: relative; /* Positioning for animation */
      }

      .shadow-bg {
        position: absolute; /* Position the background shadow */
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.3); /* Shadow color */
        border-radius: 20px; /* Match container's border radius */
        z-index: -1; /* Place behind the container */
      }

      h1 {
        font-size: 36px; /* Larger main heading */
        margin: 10px 0; /* Margin around heading */
      }

      h2 {
        font-size: 24px; /* Larger subheading */
        margin: 5px 0; /* Margin around subheading */
      }

      p {
        font-size: 18px; /* Font size for additional text */
        margin: 15px 0; /* Margin around the paragraph */
        line-height: 1.6; /* Improve readability */
      }

      a {
        font-size: 20px; /* Font size for links */
        color: white; /* White text color */
        background-color: #2980b9; /* Primary button color */
        text-decoration: none; /* Remove underline */
        padding: 12px 20px; /* Padding for links */
        display: inline-block; /* Make links block elements */
        margin: 10px 0; /* Margin between links */
        border-radius: 5px; /* Rounded corners */
        transition: background-color 0.3s, transform 0.3s; /* Smooth transitions */
      }

      a:hover {
        background-color: #3498db; /* Lighter blue on hover */
        transform: translateY(-3px); /* Slight lift effect on hover */
      }

      footer {
        margin-top: 20px; /* Margin above the footer */
        font-size: 14px; /* Smaller font size */
      }

      /* Responsive design */
      @media (max-width: 600px) {
        .container {
          width: 90%; /* Make container responsive */
        }

        h1 {
          font-size: 28px; /* Smaller heading on mobile */
        }

        h2 {
          font-size: 20px; /* Smaller subheading on mobile */
        }

        a {
          font-size: 18px; /* Smaller link font size on mobile */
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="shadow-bg"></div> <!-- Background shadow color -->
      <h1>Home</h1>
      <h2>FSWD Lab</h2>
      <p>Name: Shathees Gv</p>
      <p>Registration Number: 810022205089</p>

      <a id="ap" href="new2micro.html">Micro</a><br>
      <a id="op" href="index2.html">To-Do List</a><br>
      <a href="index10.html">Food App</a>
      <footer>© 2024 Shathees Gv</footer> <!-- Footer for credits -->
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Layout Homepage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: white;
            background: linear-gradient(to bottom right, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Hero section */
        .hero {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7); /* Dark overlay */
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 48px;
            margin: 10px 0;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        h2 {
            font-size: 30px;
            margin: 5px 0;
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        p {
            font-size: 20px;
            line-height: 1.5;
            margin: 15px 0;
        }

        a {
            font-size: 20px;
            color: white;
            background: #ff6a00;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s, transform 0.3s;
            display: inline-block;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        a::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: #ff8c00;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        a:hover {
            background: #ff8c00;
            transform: translateY(-3px);
        }

        a:hover::before {
            transform: translateY(0);
        }

        footer {
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.8;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }
            h2 {
                font-size: 24px;
            }
            p {
                font-size: 18px;
            }
            a {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to My Homepage</h1>
        <h2>FSWD Lab</h2>
        <p>Name: Shathees Gv</p>
        <p>Registration Number: 810022205089</p>

        <a href="index10.html">Food App</a>
        <footer>© 2024 Shathees Gv</footer>
    </div>
</body>
</html>

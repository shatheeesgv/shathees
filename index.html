<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Attractive Homepage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc); /* Gradient background */
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            position: relative;
            max-width: 450px;
            width: 100%;
            padding: 40px;
            background: rgba(0, 0, 0, 0.9); /* Darker semi-transparent background */
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeIn 1s ease-in; /* Fade in animation */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 36px;
            margin: 10px 0;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.5); /* Enhanced text shadow */
        }

        h2 {
            font-size: 24px;
            margin: 5px 0;
            animation: slideIn 0.5s ease-in-out; /* Slide in effect for subheading */
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        p {
            font-size: 18px;
            line-height: 1.5;
            margin: 15px 0;
            animation: fadeIn 0.5s ease-in-out; /* Fade in effect for paragraphs */
        }

        a {
            font-size: 18px;
            color: white;
            background: #ff6a00; /* Button color */
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s; /* Smooth transitions */
            display: inline-block;
            margin: 10px 0;
            position: relative; /* For pseudo-element */
            overflow: hidden; /* Contain pseudo-elements */
        }

        a::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px; /* Underline effect */
            background: #ff8c00; /* Underline color */
            transform: translateY(100%); /* Start hidden */
            transition: transform 0.3s; /* Smooth underline effect */
        }

        a:hover {
            background: #ff8c00; /* Button hover color */
            transform: translateY(-3px); /* Lift effect */
        }

        a:hover::before {
            transform: translateY(0); /* Show underline on hover */
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8; /* Slightly transparent */
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 20px;
            }

            a {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Homepage</h1>

</body>
</html>
